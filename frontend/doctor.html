<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MedVoice — Redirecting…</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<!--
  MedVoice moved from a two-device model (this page + patient.html, each a
  separate LiveKit participant) to a single shared-device consultation
  screen. patient.html is now the one real implementation — this page just
  forwards old links/bookmarks there, preserving the room query string.
-->
<div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px;">
  <h1 style="font-family:var(--font-display); font-size:24px; color:var(--teal-deep); margin:0;">MedVoice has moved</h1>
  <p style="color:#5B6B65; max-width:320px; margin:0;">The doctor and patient now share one consultation screen. Redirecting…</p>
  <a id="fallbackLink" href="patient.html" style="margin-top:8px; padding:14px 32px; border-radius:999px; background:var(--teal-deep); color:white; text-decoration:none; font-weight:600;">Go to MedVoice</a>
</div>
<script>
  const target = 'patient.html' + window.location.search;
  document.getElementById('fallbackLink').href = target;
  window.location.replace(target);
</script>
</body>
</html>
